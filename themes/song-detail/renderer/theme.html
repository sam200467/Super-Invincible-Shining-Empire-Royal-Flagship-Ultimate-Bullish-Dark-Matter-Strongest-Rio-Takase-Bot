<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=2160, initial-scale=1">
  <title>音击单曲全难度成绩</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main id="sheet" aria-label="音击单曲全难度成绩">
    <img id="overlay" class="overlay" src="../assets/overlay.png" alt="" data-load-label="单曲主题底图">

    <section class="song-summary">
      <img id="jacket" class="jacket" alt="歌曲封面" data-load-label="歌曲封面">
      <div id="song-title" class="song-title single-line"></div>
      <div id="artist" class="artist single-line"></div>
      <div id="status" class="status single-line"></div>

      <div class="meta version"><span>Version:</span><strong id="version"></strong></div>
      <div class="meta category"><span>Category:</span><strong id="category"></strong></div>
      <div class="meta bpm"><span>BPM:</span><strong id="bpm"></strong></div>
      <div class="meta duration"><span>TIME:</span><strong id="duration"></strong></div>
      <div class="meta song-id"><span>ID:</span><strong id="song-id"></strong></div>
      <div class="meta release-date"><span>Release Date:</span><strong id="release-date"></strong></div>
      <div id="boss-name" class="boss-meta boss-name single-line"></div>
      <div id="boss-card" class="boss-meta boss-card single-line"></div>
      <div id="boss-level" class="boss-meta boss-level single-line"></div>
      <div id="attribute" class="boss-meta attribute single-line"></div>
    </section>

    <section id="chart-rows" class="chart-rows" aria-label="各难度成绩"></section>

    <div class="footer-credit">
  <span>Generated by: Takase bot</span>
  <span>
    Function designed by:
    <span class="credit-name">DEMO</span>
  </span>
</div>

    <div id="render-error" role="alert"></div>
  </main>

  <script src="preview-data.js"></script>
  <script src="theme.js"></script>
</body>
</html>
