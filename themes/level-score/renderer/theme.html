<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440, initial-scale=1">
  <title>音击等级成绩长图</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main id="level-sheet" aria-label="音击等级成绩长图">
    <img class="page-background" src="../assets/background.png" alt="">
    <header class="hero">
      <div class="level-mark"><span>LEVEL</span><strong id="target-level"></strong></div>
      <div class="hero-copy">
        <h1 id="page-title"></h1>
        <div id="page-number" class="page-number"></div>
      </div>
      <section class="player" aria-label="玩家资料">
        <img id="avatar" class="avatar" alt="玩家头像">
        <div class="player-copy">
          <div id="player-name" class="player-name"></div>
          <div id="player-level" class="player-level"></div>
        </div>
      </section>
      <section id="summary" class="summary" aria-label="统计"></section>
    </header>

    <div class="sort-note">按个人最佳 TECHNICAL SCORE 从高到低排列 · 未游玩谱面置于末尾</div>
    <section id="chart-grid" class="chart-grid" aria-label="谱面成绩"></section>

    <footer>
      <span>
        Generated by: <b class="Takase bot">Takase bot</b>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        Function designed by: <b class="sam">DEMO</b>
      </span>
    </footer>
    <div id="render-error" role="alert"></div>
  </main>
  <script src="preview-data.js"></script>
  <script src="theme.js"></script>
</body>
</html>
