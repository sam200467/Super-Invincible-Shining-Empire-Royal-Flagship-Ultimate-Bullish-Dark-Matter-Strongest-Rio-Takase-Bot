<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=3600, initial-scale=1">
  <title>音击分表主题预览</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main id="sheet" aria-label="音击分表">
    <img id="overlay" class="overlay" src="../assets/overlay.png" alt="" data-load-label="静态底图 overlay.png">

    <section id="player" class="player-block">
      <img id="avatar" class="avatar" alt="玩家头像">
      <div id="level" class="level"></div>
      <div id="player-name" class="player-name outlined-gradient" data-text=""></div>
    </section>

    <section class="rating-block">
      <div id="b50-average" class="average average-b50"></div>
      <div id="n10-average" class="average average-n10"></div>
      <div id="p50-average" class="average average-p50"></div>
      <div class="rating-separator" aria-hidden="true">
        <span>—</span><span>—</span><span>—</span>
      </div>
      <div id="rating" class="rating-value outlined-gradient" data-text=""></div>
    </section>

    <div id="generation-time" class="generation-time"></div>
    <div id="best-grid" class="card-grid best-grid"></div>
    <div id="new-grid" class="card-grid new-grid"></div>
    <div id="platinum-grid" class="card-grid platinum-grid"></div>

    <footer class="footer">
      <div id="generator-name" class="generator-name"></div>

      <div class="designer-name">
        Function designed by:<span>DEMO</span>
      </div>

      <div id="play-count" class="play-count"></div>
      <div id="last-play" class="last-play"></div>
    </footer>

    <div id="render-error" role="alert"></div>
  </main>

  <script src="preview-data.js"></script>
  <script src="theme.js"></script>
</body>
</html>
