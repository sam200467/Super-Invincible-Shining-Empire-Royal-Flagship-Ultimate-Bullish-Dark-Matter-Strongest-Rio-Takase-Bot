<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>音击牌子完成度</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main id="completion-sheet" aria-label="音击版本牌子完成度">
    <img id="background" class="background" src="../assets/back_base.png" alt="">
    <img id="plate-frame" class="plate-frame" alt="牌子完整布局">

    <section class="player-card" aria-label="玩家资料">
      <img id="avatar" class="avatar" alt="玩家头像">
      <div id="player-level" class="player-level" data-text=""></div>
      <div id="player-name" class="player-name" data-text=""></div>
    </section>

    <section id="level-groups" class="level-groups" aria-label="MASTER 难度完成情况"></section>
    <section id="difficulty-summary" class="difficulty-summary" aria-label="四难度完成度汇总"></section>

    <div class="footer-credit">
      <span>Generated by: Takase bot</span>
      <span>Function designed by: <span class="credit-name">DEMO</span></span>
    </div>

    <div id="render-error" role="alert"></div>
  </main>

  <script src="preview-data.js"></script>
  <script src="theme.js"></script>
</body>
</html>
